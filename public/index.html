<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrameGenjutsu - keyframe animation</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236ee7b7'/%3E%3Crect x='7' y='9' width='4' height='14' rx='1.5' fill='%230d0f12'/%3E%3Crect x='14' y='9' width='4' height='14' rx='1.5' fill='%230d0f12' opacity='.55'/%3E%3Crect x='21' y='9' width='4' height='14' rx='1.5' fill='%230d0f12'/%3E%3C/svg%3E" />
<script>
(function () {
  try {
    var saved = localStorage.getItem("comicgen-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (err) {}
})();
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1 style="font-">FrameGenjutsu</h1>
      <p class="tagline">Upload a start, middle and end frame. The engine fills in the motion.</p>
    </div>
  </div>
  <div class="topbar-actions">
    <span id="health" class="pill pill-muted" title="Server status">checking...</span>
    <button id="theme-toggle" class="btn btn-ghost" type="button">Theme</button>
  </div>
</header>

<main class="layout">

  <section class="panel">
    <h2 class="panel-title">Scene</h2>

    <div class="field">
      <label for="scene">Scene name <span class="hint">folder written under <code>projects/</code></span></label>
      <input id="scene" type="text" placeholder="rooftop-chase" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <label for="prompt">Prompt <span class="hint">what should happen between the frames</span></label>
      <textarea id="prompt" rows="3" placeholder="The character turns their head slowly toward the window as the rain picks up. Hand-drawn anime style, consistent line weight."></textarea>
    </div>

    <div class="grid-2">
      <div class="field">
        <label for="provider">AI endpoint</label>
        <select id="provider"></select>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
    </div>
    <p id="provider-note" class="note"></p>

    <div class="grid-2">
      <div class="field">
        <label for="count-a">Frames between start and middle</label>
        <select id="count-a"></select>
      </div>
      <div class="field">
        <label for="count-b">Frames between middle and end</label>
        <select id="count-b"></select>
      </div>
    </div>

    <h2 class="panel-title">Anchor frames</h2>
    <div class="drops">
      <label class="drop" data-slot="start">
        <input type="file" accept="image/*" hidden />
        <img class="thumb" alt="" hidden />
        <span class="drop-label">Start frame<small>1.png</small></span>
      </label>
      <label class="drop" data-slot="middle">
        <input type="file" accept="image/*" hidden />
        <img class="thumb" alt="" hidden />
        <span class="drop-label">Middle frame<small>keyframe two</small></span>
      </label>
      <label class="drop" data-slot="end">
        <input type="file" accept="image/*" hidden />
        <img class="thumb" alt="" hidden />
        <span class="drop-label">End frame<small>last frame</small></span>
      </label>
    </div>

    <details class="advanced">
      <summary>Advanced</summary>

      <div class="field">
        <label for="negative">Negative prompt</label>
        <input id="negative" type="text" placeholder="blur, warping, extra limbs, flicker" />
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="duration">Clip length per segment</label>
          <select id="duration">
            <option value="5">5 s</option>
            <option value="6">6 s</option>
            <option value="10">10 s</option>
          </select>
        </div>
        <div class="field">
          <label for="fps">Preview fps</label>
          <input id="fps" type="number" min="1" max="60" value="12" />
        </div>
        <div class="field">
          <label for="numbering">File numbering</label>
          <select id="numbering">
            <option value="play-order">Play order (1.png = start)</option>
            <option value="anchors-first">Anchors first (1-3.png, then generated)</option>
          </select>
        </div>
      </div>

      <div class="checks">
        <label class="check"><input id="overwrite" type="checkbox" /> Overwrite an existing scene folder</label>
        <label class="check"><input id="reuse" type="checkbox" /> Reuse cached clips from a previous run</label>
        <label class="check"><input id="preview" type="checkbox" checked /> Build preview.mp4 / preview.gif</label>
      </div>
    </details>

    <div class="actions">
      <button id="generate" class="btn btn-primary" type="button">Generate frames</button>
      <button id="cancel" class="btn btn-ghost" type="button" disabled>Cancel</button>
    </div>
    <p id="notice" class="notice" hidden></p>
  </section>

  <section class="panel">
    <h2 class="panel-title">Progress <span id="stage" class="stage">idle</span></h2>
    <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    <div id="log" class="log" aria-live="polite"></div>

    <h2 class="panel-title">Result</h2>
    <div id="result" class="result">
      <p class="empty">Generated frames will appear here.</p>
    </div>

    <h2 class="panel-title">Saved scenes</h2>
    <div id="scenes" class="scenes"><p class="empty">No scenes yet.</p></div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
